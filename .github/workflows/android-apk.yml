name: Build Huawei Pad APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare download file
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk PET-Vocab-Huawei-Pad.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: PET-Vocab-Huawei-Pad-APK
          path: PET-Vocab-Huawei-Pad.apk
          if-no-files-found: error
          retention-days: 30
